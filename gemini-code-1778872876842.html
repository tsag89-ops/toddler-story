<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toddler Storyteller</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <header>
            <h1 id="story-title">Tap to Begin</h1>
        </header>
        <main>
            <div id="image-container">
                <img id="story-image" src="" alt="Story illustration" style="display:none;">
            </div>
            <p id="story-text">Welcome to your global library of myths and folktales.</p>
        </main>
        <footer>
            <button id="next-btn" class="montessori-btn">Next Story</button>
            <button id="read-btn" class="montessori-btn">Read Aloud</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
